<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RSS агрегатор</title>
  </head>
  <body>
    <div id="app">
      <main class="mx-auto max-w-3xl px-6 py-12">
        <h1 class="text-4xl font-bold text-gray-900">
          RSS агрегатор
        </h1>

        <p class="mt-4 text-lg text-gray-600">
          Читайте новости из любимых источников в одном месте.
        </p>

        <form id="form" class="mt-8" novalidate>
          <label for="rss-url" class="block font-medium text-gray-900">
            Ссылка RSS
          </label>

          <div class="mt-2 flex flex-col gap-3 sm:flex-row">
            <input
              id="rss-url"
              name="url"
              type="url"
              placeholder="https://example.com/feed.xml"
              required
              aria-describedby="Error"
              class="min-w-0 flex-1 rounded-lg border border-gray-300 px-4 py-3 focus:border-blue-600 focus:ring-blue-600"
            >

            <button
              id="add-button"
              type="submit"
              class="rounded-lg bg-blue-600 px-6 py-3 font-semibold text-white hover:bg-blue-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600"
            >
              Добавить
            </button>
          </div>
        </form>
        <p id="Error" aria-live="polite"></p>
        <section>
          <h2 id="feeds-heading"></h2>
          <ul id="feeds-list"></ul>  
        </section>
        <section class="mt-8">
          <h2 id="posts-heading" class="text-2xl font-bold"></h2>
          <ul id="posts-list" class="mt-4 space-y-3"></ul>
        </section>
      </main>
      <dialog
        id="post-preview"
        aria-labelledby="modal-title"
        class="m-auto max-h-[80vh] w-11/12 max-w-xl overflow-y-auto rounded-xl border-0 bg-white p-6 text-gray-900 shadow-xl backdrop:bg-black/50"
      >
        <h2 id="modal-title" class="break-words text-2xl font-bold"></h2>
        <div
          data-test="modal-body"
          class="mt-4 whitespace-pre-wrap break-words text-gray-700"
        ></div>
        <div class="mt-6 flex flex-wrap justify-end gap-3">
          <a
            id="modal-read-full"
            target="_blank"
            rel="noopener noreferrer"
            class="rounded-lg bg-blue-600 px-4 py-2 font-semibold text-white hover:bg-blue-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600"
          ></a>
          <button
            id="modal-close"
            type="button"
            autofocus
            class="rounded-lg border border-gray-300 px-4 py-2 font-semibold hover:bg-gray-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600"
          ></button>
        </div>
      </dialog>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
